<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Guessing Game</title>
</head>
<body>

<h1>110502029_Number Guessing Game</h1>

<div id="result"></div>

<script>
var answer = Math.floor(Math.random() * 100) + 1;
var chances = 7;
var low = 1;
var high = 100;

while (chances > 0) {
    var input = window.prompt(
        "請輸入有效範圍：" + low + " 到 " + high + "之間的整數。\n" +
        "你還有 " + chances + " 次機會。"
    );

    if (input === null) {
        alert("遊戲結束");
        break;
    }

    input = input.trim();

    if (input === "" || isNaN(input)) {
        alert("請輸入有效範圍內的數字（不能超出 1 到 100）！");
        continue;
    }

    var guess = Number(input);

    if (guess < 1 || guess > 100) {
        alert("請輸入有效範圍內的數字（不能超出 1 到 100）！");
        continue;
    }

    if (guess < low || guess > high) {
        alert("請輸入目前範圍內的數字（" + low + " 到 " + high + "）！");
        continue;
    }

    chances--;

    if (guess === answer) {
        document.getElementById("result").innerHTML = '<img src="correct.jpg">';
        alert("恭喜你答對了！正確答案是：" + answer);
        break;
    } else if (guess < answer) {
        alert("猜的太小了！");
        low = guess + 1;
    } else {
        alert("猜的太大了！");
        high = guess - 1;
    }

    if (chances === 0) {
        document.getElementById("result").innerHTML = '<img src="wrong.jpg">';
        alert("沒有機會了！正確答案是：" + answer);
    }
}
</script>

</body>
</html>
